<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>PKour - Moderazione Spot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 0;
        padding: 0;
        background: #0f172a;
        color: #e5e7eb;
      }
      header {
        padding: 16px 24px;
        border-bottom: 1px solid #1f2937;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      header h1 {
        font-size: 18px;
        margin: 0;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
        gap: 0;
        height: calc(100vh - 56px);
      }
      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
        }
      }
      .left,
      .right {
        padding: 16px;
        overflow: auto;
      }
      .left {
        border-right: 1px solid #1f2937;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 12px;
      }
      .spot-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }
      .tab {
        border-radius: 999px;
        border: 1px solid #1f2937;
        background: #020617;
        color: #9ca3af;
        padding: 4px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .tab.active {
        background: #0f766e;
        color: #ecfeff;
        border-color: #0f766e;
      }
      .spot-item {
        border-radius: 8px;
        border: 1px solid #1f2937;
        padding: 10px 12px;
        background: #020617;
        cursor: pointer;
      }
      .spot-item.active {
        border-color: #22c55e;
        background: #022c22;
      }
      .spot-item-title {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        margin-bottom: 4px;
      }
      .spot-item-meta {
        font-size: 12px;
        color: #9ca3af;
      }
      .detail-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .pill.pending {
        background: #1e293b;
        color: #facc15;
      }
      .pill.approved {
        background: #022c22;
        color: #4ade80;
      }
      .pill.rejected {
        background: #450a0a;
        color: #fca5a5;
      }
      .section {
        margin-bottom: 12px;
      }
      .section-title {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #9ca3af;
        margin-bottom: 4px;
      }
      .section-body {
        font-size: 14px;
      }
      .map-container {
        width: 100%;
        height: 340px;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid #1f2937;
        margin-bottom: 10px;
      }
      .map-actions {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 10px;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      button {
        border-radius: 6px;
        border: none;
        padding: 6px 10px;
        font-size: 13px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .btn-approve {
        background: #22c55e;
        color: #022c22;
      }
      .btn-reject {
        background: #b91c1c;
        color: #fee2e2;
      }
      .btn-delete {
        background: #4b5563;
        color: #e5e7eb;
      }
      .btn-refresh {
        background: #0f766e;
        color: #e0f2fe;
      }
      .btn-street {
        background: #1d4ed8;
        color: #dbeafe;
      }
      .small {
        font-size: 12px;
        color: #9ca3af;
      }
      input[type='text'],
      input[type='email'],
      input[type='password'] {
        background: #020617;
        border-radius: 4px;
        border: 1px solid #1f2937;
        padding: 4px 6px;
        color: #e5e7eb;
        font-size: 12px;
        width: 220px;
      }
      .auth-wrapper {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .login-form {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .auth-user {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .auth-label {
        font-size: 12px;
        color: #9ca3af;
      }
      .btn-logout {
        background: #7c2d12;
        color: #ffedd5;
      }
      #auth-status {
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>PKour &mdash; Moderazione Spot</h1>
      <div class="auth-wrapper">
        <form id="login-form" class="login-form">
          <input id="email" type="email" placeholder="Email admin" autocomplete="username" required />
          <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
          <button class="btn-refresh" id="btn-login" type="submit">Login</button>
        </form>
        <div id="auth-user" class="auth-user" style="display:none;">
          <span id="auth-user-label" class="auth-label"></span>
          <button class="btn-refresh" id="btn-load" type="button">Ricarica lista</button>
          <button class="btn-logout" id="btn-logout" type="button">Logout</button>
        </div>
      </div>
    </header>
    <div id="auth-status" class="small" style="padding: 8px 24px;"></div>
    <main>
      <section class="left">
        <div class="tabs">
          <button class="tab active" data-status="pending">Pending</button>
          <button class="tab" data-status="approved">Approved</button>
          <button class="tab" data-status="rejected">Rejected</button>
        </div>
        <h2 id="list-title">Spot pending</h2>
        <div id="list" class="spot-list"></div>
      </section>
      <section class="right">
        <div id="detail-empty" class="small">Seleziona uno spot per vedere i dettagli.</div>
        <div id="detail" style="display:none;">
          <div class="detail-header">
            <div>
              <h2 id="detail-nome"></h2>
              <div class="small" id="detail-coords"></div>
            </div>
            <span id="detail-status" class="pill pending">PENDING</span>
          </div>

          <div class="map-container" id="map-container">
            <iframe id="map-frame" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>

          <div class="map-actions">
            <button class="btn-street" id="btn-street-view">Street View</button>
          </div>

          <div class="section">
            <div class="section-title">Descrizione</div>
            <div class="section-body" id="detail-descrizione"></div>
          </div>

          <div class="section">
            <div class="section-title">Info</div>
            <div class="section-body small" id="detail-info"></div>
          </div>

          <div class="section">
            <div class="section-title">Features</div>
            <div class="section-body small" id="detail-features"></div>
          </div>

          <div class="actions">
            <button class="btn-approve" id="btn-approve">Approva</button>
            <button class="btn-reject" id="btn-reject">Rifiuta</button>
            <button class="btn-delete" id="btn-delete">Elimina</button>
          </div>
        </div>
      </section>
    </main>

    <script>
      const FIREBASE_WEB_API_KEY = 'AIzaSyD2L9ASdm2Nl0EJgr4-IIr84Xe1WWm_WbU';
      const baseUrl = 'https://api.pkour.it';
      const authStatusEl = document.getElementById('auth-status');
      const mainEl = document.querySelector('main');
      const listEl = document.getElementById('list');
      const loginForm = document.getElementById('login-form');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const authUser = document.getElementById('auth-user');
      const authUserLabel = document.getElementById('auth-user-label');
      const btnLogin = document.getElementById('btn-login');
      const btnLoad = document.getElementById('btn-load');
      const btnLogout = document.getElementById('btn-logout');

      const detailWrapper = document.getElementById('detail');
      const detailEmpty = document.getElementById('detail-empty');
      const detailNome = document.getElementById('detail-nome');
      const detailCoords = document.getElementById('detail-coords');
      const detailDescrizione = document.getElementById('detail-descrizione');
      const detailInfo = document.getElementById('detail-info');
      const detailFeatures = document.getElementById('detail-features');
      const detailStatus = document.getElementById('detail-status');
      const mapFrame = document.getElementById('map-frame');

      const listTitle = document.getElementById('list-title');
      const tabs = document.querySelectorAll('.tab');

      const btnApprove = document.getElementById('btn-approve');
      const btnReject = document.getElementById('btn-reject');
      const btnDelete = document.getElementById('btn-delete');
      const btnStreetView = document.getElementById('btn-street-view');

      let currentSpot = null;
      let spots = [];
      let currentStatusFilter = 'pending';
      let currentStreetUrl = null;
      let idToken = localStorage.getItem('pkour_admin_id_token') || '';
      let loggedEmail = localStorage.getItem('pkour_admin_email') || '';

      function setAuthStatus(message, isError = false) {
        authStatusEl.textContent = message;
        authStatusEl.style.color = isError ? '#fca5a5' : '#9ca3af';
      }

      function setAuthenticatedState(isAuthenticated) {
        loginForm.style.display = isAuthenticated ? 'none' : 'flex';
        authUser.style.display = isAuthenticated ? 'flex' : 'none';
        mainEl.style.display = isAuthenticated ? 'grid' : 'none';
        authUserLabel.textContent = isAuthenticated ? `Admin: ${loggedEmail}` : '';

        if (!isAuthenticated) {
          currentSpot = null;
          listEl.innerHTML = '<div class="small">Effettua il login admin per visualizzare gli spot.</div>';
          detailWrapper.style.display = 'none';
          detailEmpty.style.display = 'block';
        }
      }

      function clearAuthSession() {
        idToken = '';
        loggedEmail = '';
        localStorage.removeItem('pkour_admin_id_token');
        localStorage.removeItem('pkour_admin_email');
      }

      function mapFirebaseAuthError(code) {
        const clean = String(code || '').toUpperCase();
        switch (clean) {
          case 'INVALID_LOGIN_CREDENTIALS':
          case 'INVALID_PASSWORD':
          case 'EMAIL_NOT_FOUND':
            return 'Credenziali non valide';
          case 'USER_DISABLED':
            return 'Utente disabilitato';
          case 'TOO_MANY_ATTEMPTS_TRY_LATER':
            return 'Troppi tentativi. Riprova più tardi';
          default:
            return 'Errore di autenticazione Firebase';
        }
      }

      async function loginAdmin(email, password) {
        const res = await fetch(
          `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${encodeURIComponent(FIREBASE_WEB_API_KEY)}`,
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              email,
              password,
              returnSecureToken: true,
            }),
          },
        );

        const data = await res.json().catch(() => null);
        if (!res.ok || !data || !data.idToken) {
          const code = data && data.error ? data.error.message : null;
          throw new Error(mapFirebaseAuthError(code));
        }

        return data;
      }

      function statusClass(status) {
        switch (status) {
          case 'approved':
            return 'pill approved';
          case 'rejected':
            return 'pill rejected';
          default:
            return 'pill pending';
        }
      }

      async function fetchJson(path, options = {}) {
        if (!idToken) {
          throw new Error('Sessione admin non valida. Effettua il login.');
        }

        const headers = {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + idToken,
        };

        const res = await fetch(baseUrl + path, {
          ...options,
          headers: {
            ...headers,
            ...(options.headers || {}),
          },
        });

        if (res.status === 204) return null;

        const data = await res.json().catch(() => null);
        if (!res.ok) {
          const msg = (data && data.error) || 'Errore API';
          if (res.status === 401 || res.status === 403) {
            clearAuthSession();
            setAuthenticatedState(false);
            setAuthStatus('Accesso negato: account non admin o sessione scaduta.', true);
          }
          alert(msg);
          throw new Error(msg);
        }

        return data;
      }

      async function loadSpots(status) {
        listEl.innerHTML = 'Caricamento...';
        detailWrapper.style.display = 'none';
        detailEmpty.style.display = 'block';
        currentSpot = null;

        const statusLabel =
          status === 'approved' ? 'Spot approvati' : status === 'rejected' ? 'Spot rifiutati' : 'Spot pending';
        listTitle.textContent = statusLabel;

        try {
          const data = await fetchJson(`/api/spots?status=${encodeURIComponent(status)}&limit=50&offset=0`);
          spots = data && Array.isArray(data.data) ? data.data : [];

          if (spots.length === 0) {
            listEl.innerHTML = '<div class="small">Nessuno spot in questo stato.</div>';
            return;
          }

          listEl.innerHTML = '';

          spots.forEach((s) => {
            const item = document.createElement('div');
            item.className = 'spot-item';
            item.dataset.id = s.id;
            item.innerHTML = `
              <div class="spot-item-title">
                <span>${s.nome}</span>
                <span class="small">${s.tipo || ''}</span>
              </div>
              <div class="spot-item-meta">
                lat: ${s.posizione.lat.toFixed(4)}, lon: ${s.posizione.lon.toFixed(4)}
              </div>
            `;
            item.addEventListener('click', () => selectSpot(s.id));
            listEl.appendChild(item);
          });
        } catch (err) {
          console.error(err);
          listEl.innerHTML = '<div class="small">Errore nel caricamento.</div>';
        }
      }

      async function selectSpot(id) {
        const items = listEl.querySelectorAll('.spot-item');
        items.forEach((el) => {
          el.classList.toggle('active', String(el.dataset.id) === String(id));
        });

        try {
          const detail = await fetchJson('/api/spots/' + id);
          currentSpot = detail;
          renderDetail();
        } catch (err) {
          console.error(err);
        }
      }

      function renderDetail() {
        if (!currentSpot) return;

        detailEmpty.style.display = 'none';
        detailWrapper.style.display = 'block';

        const s = currentSpot;
        detailNome.textContent = s.nome;
        detailCoords.textContent = `lat: ${s.posizione.lat}, lon: ${s.posizione.lon}`;
        detailDescrizione.textContent = s.descrizione || '(nessuna descrizione)';
        detailInfo.textContent = `tipo: ${s.tipo}, status: ${s.status}`;
        detailStatus.textContent = (s.status || 'pending').toUpperCase();
        detailStatus.className = statusClass(s.status || 'pending');

        const feats = Array.isArray(s.features) && s.features.length
          ? s.features.join(', ')
          : '(nessuna feature)';
        detailFeatures.textContent = feats;

        const lat = s.posizione.lat;
        const lon = s.posizione.lon;
        const q = encodeURIComponent(`${lat},${lon}`);
        const url = `https://www.google.com/maps?q=${q}&z=18&output=embed`;
        mapFrame.src = url;

        currentStreetUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lon}`;
      }

      async function updateStatus(newStatus) {
        if (!currentSpot) return;
        try {
          const updated = await fetchJson(`/api/spots/${currentSpot.id}/status`, {
            method: 'PATCH',
            body: JSON.stringify({ status: newStatus }),
          });
          currentSpot = updated;
          renderDetail();
          await loadSpots(currentStatusFilter);
        } catch (err) {
          console.error(err);
        }
      }

      async function deleteSpot() {
        if (!currentSpot) return;
        if (!confirm('Sei sicuro di voler eliminare definitivamente questo spot?')) return;
        try {
          await fetchJson(`/api/spots/${currentSpot.id}`, { method: 'DELETE' });
          currentSpot = null;
          await loadSpots(currentStatusFilter);
        } catch (err) {
          console.error(err);
        }
      }

      btnLoad.addEventListener('click', () => loadSpots(currentStatusFilter));
      btnApprove.addEventListener('click', () => updateStatus('approved'));
      btnReject.addEventListener('click', () => updateStatus('rejected'));
      btnDelete.addEventListener('click', deleteSpot);

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = (emailInput.value || '').trim();
        const password = passwordInput.value || '';

        if (!email || !password) {
          setAuthStatus('Inserisci email e password admin.', true);
          return;
        }

        btnLogin.disabled = true;
        setAuthStatus('Login in corso...');

        try {
          const authData = await loginAdmin(email, password);
          idToken = authData.idToken;
          loggedEmail = authData.email || email;
          localStorage.setItem('pkour_admin_id_token', idToken);
          localStorage.setItem('pkour_admin_email', loggedEmail);

          setAuthenticatedState(true);
          setAuthStatus('Login effettuato. Verifica permessi admin...');
          await loadSpots(currentStatusFilter);
          setAuthStatus('Accesso admin attivo.');
          passwordInput.value = '';
        } catch (err) {
          clearAuthSession();
          setAuthenticatedState(false);
          setAuthStatus(err instanceof Error ? err.message : 'Errore durante il login', true);
        } finally {
          btnLogin.disabled = false;
        }
      });

      btnLogout.addEventListener('click', () => {
        clearAuthSession();
        setAuthenticatedState(false);
        setAuthStatus('Logout effettuato.');
      });

      tabs.forEach((tab) => {
        tab.addEventListener('click', () => {
          const status = tab.dataset.status || 'pending';
          currentStatusFilter = status;
          tabs.forEach((t) => t.classList.toggle('active', t === tab));
          loadSpots(currentStatusFilter);
        });
      });

      btnStreetView.addEventListener('click', () => {
        if (currentStreetUrl) {
          window.open(currentStreetUrl, '_blank');
        }
      });

      setAuthenticatedState(Boolean(idToken));
      if (idToken) {
        setAuthStatus('Sessione trovata. Verifica accesso admin...');
        loadSpots(currentStatusFilter)
          .then(() => setAuthStatus('Accesso admin attivo.'))
          .catch(() => {});
      } else {
        setAuthStatus('Effettua login con account admin Firebase.');
      }
    </script>
  </body>
</html>
